name: Deploy GitHub Pages

# The complete site is deployed by publish-from-core.yml straight from its
# publish workspace: Pages-only shards (security/quality/ranking/skill-detail
# shards, docs/skills/ pages, lite index) are no longer committed to main.
# A checkout of main is therefore an incomplete site, so this workflow no longer
# runs on push. Manual runs fail closed unless the checkout is complete; to
# redeploy, re-run publish-from-core with the last known-good core/data SHAs
# from provenance/merge-source.json.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Refuse to deploy an incomplete site
        run: |
          set -euo pipefail
          missing=0
          for path in \
            docs/security-index-manifest.json \
            docs/quality-index-manifest.json \
            docs/ranking-index-manifest.json \
            docs/search-index-lite.json \
            docs/skill-detail-shards; do
            if [ ! -e "$path" ]; then
              echo "::error::$path is not committed; deploy via publish-from-core instead."
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
