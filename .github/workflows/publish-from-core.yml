name: Publish Merged Artifact (From Core)

on:
  repository_dispatch:
    types: [publish_from_core]
  workflow_dispatch:
    inputs:
      core_repo:
        description: Core repository (owner/name)
        required: false
        default: majiayu000/claude-skill-registry-core
      core_sha:
        description: Core commit SHA
        required: true
      data_repo:
        description: Data repository (owner/name)
        required: false
        default: ""
      data_sha:
        description: Data commit SHA
        required: true

permissions:
  contents: write

concurrency:
  group: publish-main-artifact
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve publish refs
        id: refs
        env:
          PAYLOAD_CORE_REPO: ${{ github.event.client_payload.core_repo }}
          PAYLOAD_CORE_SHA: ${{ github.event.client_payload.core_sha }}
          PAYLOAD_DATA_REPO: ${{ github.event.client_payload.data_repo }}
          PAYLOAD_DATA_SHA: ${{ github.event.client_payload.data_sha }}
          INPUT_CORE_REPO: ${{ github.event.inputs.core_repo }}
          INPUT_CORE_SHA: ${{ github.event.inputs.core_sha }}
          INPUT_DATA_REPO: ${{ github.event.inputs.data_repo }}
          INPUT_DATA_SHA: ${{ github.event.inputs.data_sha }}
          DEFAULT_DATA_REPO: ${{ vars.REGISTRY_DATA_REPO }}
        run: |
          core_repo="${PAYLOAD_CORE_REPO:-$INPUT_CORE_REPO}"
          core_sha="${PAYLOAD_CORE_SHA:-$INPUT_CORE_SHA}"
          data_repo="${PAYLOAD_DATA_REPO:-$INPUT_DATA_REPO}"
          data_sha="${PAYLOAD_DATA_SHA:-$INPUT_DATA_SHA}"

          if [ -z "$data_repo" ]; then
            data_repo="$DEFAULT_DATA_REPO"
          fi

          if [ -z "$core_repo" ] || [ -z "$core_sha" ] || [ -z "$data_repo" ] || [ -z "$data_sha" ]; then
            echo "Missing required publish refs."
            echo "core_repo=$core_repo"
            echo "core_sha=$core_sha"
            echo "data_repo=$data_repo"
            echo "data_sha=$data_sha"
            exit 1
          fi

          echo "core_repo=$core_repo" >> "$GITHUB_OUTPUT"
          echo "core_sha=$core_sha" >> "$GITHUB_OUTPUT"
          echo "data_repo=$data_repo" >> "$GITHUB_OUTPUT"
          echo "data_sha=$data_sha" >> "$GITHUB_OUTPUT"

      - name: Free runner disk for large publish
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/node || true

          docker system prune -af || true

          echo "Disk after cleanup:"
          df -h

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Capture previous publish provenance
        run: |
          set -euo pipefail
          test -s provenance/merge-source.json
          cp provenance/merge-source.json "$RUNNER_TEMP/previous-merge-source.json"

      - name: Checkout pinned core
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.refs.outputs.core_repo }}
          ref: ${{ steps.refs.outputs.core_sha }}
          token: ${{ secrets.MAIN_REPO_TOKEN != '' && secrets.MAIN_REPO_TOKEN || github.token }}
          path: _sources/core
          filter: tree:0
          fetch-depth: 0

      - name: Checkout pinned data
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.refs.outputs.data_repo }}
          ref: ${{ steps.refs.outputs.data_sha }}
          token: ${{ secrets.DATA_REPO_TOKEN != '' && secrets.DATA_REPO_TOKEN || github.token }}
          path: _sources/data
          filter: tree:0
          fetch-depth: 0

      - name: Move source repos to temp dirs
        id: srcpaths
        run: |
          CORE_DIR="$RUNNER_TEMP/publish-core"
          DATA_DIR="$RUNNER_TEMP/publish-data"
          rm -rf "$CORE_DIR" "$DATA_DIR"
          mv _sources/core "$CORE_DIR"
          mv _sources/data "$DATA_DIR"
          rm -rf _sources
          echo "core_dir=$CORE_DIR" >> "$GITHUB_OUTPUT"
          echo "data_dir=$DATA_DIR" >> "$GITHUB_OUTPUT"

      - name: Build validated publish commit message
        env:
          CORE_REPO: ${{ steps.refs.outputs.core_repo }}
          CORE_SHA: ${{ steps.refs.outputs.core_sha }}
          DATA_REPO: ${{ steps.refs.outputs.data_repo }}
          DATA_SHA: ${{ steps.refs.outputs.data_sha }}
        run: |
          set -euo pipefail
          python3 "${{ steps.srcpaths.outputs.core_dir }}/scripts/build_publish_commit_message.py" \
            --previous-provenance "$RUNNER_TEMP/previous-merge-source.json" \
            --core-repo "$CORE_REPO" \
            --core-dir "${{ steps.srcpaths.outputs.core_dir }}" \
            --core-sha "$CORE_SHA" \
            --data-repo "$DATA_REPO" \
            --data-dir "${{ steps.srcpaths.outputs.data_dir }}" \
            --data-sha "$DATA_SHA" \
            --output "$RUNNER_TEMP/publish-commit-message.txt"

      - name: Rebuild main from pinned refs
        run: |
          bash "${{ steps.srcpaths.outputs.core_dir }}/scripts/sync_main_repo.sh" \
            --core "${{ steps.srcpaths.outputs.core_dir }}" \
            --data "${{ steps.srcpaths.outputs.data_dir }}" \
            --main "$GITHUB_WORKSPACE"

      - name: Write provenance manifest
        run: |
          mkdir -p provenance
          cat > provenance/merge-source.json <<EOF
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "core_repo": "${{ steps.refs.outputs.core_repo }}",
            "core_sha": "${{ steps.refs.outputs.core_sha }}",
            "data_repo": "${{ steps.refs.outputs.data_repo }}",
            "data_sha": "${{ steps.refs.outputs.data_sha }}"
          }
          EOF

      - name: Validate final artifact API contract
        run: |
          python3 "${{ steps.srcpaths.outputs.core_dir }}/scripts/check_artifact_api.py" \
            --root "$GITHUB_WORKSPACE" \
            --docs-dir "$GITHUB_WORKSPACE/docs"

      - name: Validate canary artifact and write publish status
        env:
          CORE_REPO: ${{ steps.refs.outputs.core_repo }}
          CORE_SHA: ${{ steps.refs.outputs.core_sha }}
          DATA_REPO: ${{ steps.refs.outputs.data_repo }}
          DATA_SHA: ${{ steps.refs.outputs.data_sha }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          root = Path.cwd()
          status_path = root / "provenance" / "publish-status.json"
          expected = {
              "core_repo": os.environ["CORE_REPO"],
              "core_sha": os.environ["CORE_SHA"],
              "data_repo": os.environ["DATA_REPO"],
              "data_sha": os.environ["DATA_SHA"],
          }
          run_url = (
              f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/"
              f"{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/"
              f"{os.environ.get('GITHUB_RUN_ID', '')}"
          )
          checks: list[dict[str, Any]] = []

          def load_json(path: str) -> Any:
              with (root / path).open("r", encoding="utf-8") as handle:
                  return json.load(handle)

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def check(name: str, fn) -> None:
              try:
                  detail = fn()
              except Exception as exc:
                  checks.append({"name": name, "status": "failed", "detail": str(exc)})
                  return
              checks.append({"name": name, "status": "passed", "detail": detail or "ok"})

          def assert_pointer(path: str, manifest_path: str) -> str:
              pointer = load_json(path)
              if pointer.get("deprecated_full_payload") is not True:
                  raise ValueError(f"{path} is not a deprecated full-payload pointer")
              if pointer.get("manifest") != manifest_path:
                  raise ValueError(f"{path} points to {pointer.get('manifest')!r}")
              if "records" in pointer or "skills" in pointer or "s" in pointer:
                  raise ValueError(f"{path} still contains a full payload")
              return f"{path} -> {manifest_path}"

          def assert_manifest(
              path: str,
              *,
              count_key: str = "total_count",
              artifact_base: str = ".",
          ) -> str:
              manifest = load_json(path)
              shards = manifest.get("shards") or manifest.get("parts")
              if not isinstance(shards, list) or not shards:
                  raise ValueError(f"{path} has no shard/part entries")
              total = manifest.get(count_key)
              if total is None and count_key == "total_count":
                  total = manifest.get("count")
              entry_total = sum(int(entry.get("count", 0) or 0) for entry in shards)
              if total is not None and entry_total != int(total):
                  raise ValueError(f"{path} count mismatch: entries={entry_total}, total={total}")
              for entry in shards[:3]:
                  shard_path = root / artifact_base / str(entry["path"])
                  if not shard_path.exists():
                      raise ValueError(f"missing shard {entry['path']}")
                  if int(entry.get("bytes", 0) or 0) != shard_path.stat().st_size:
                      raise ValueError(f"byte mismatch for {entry['path']}")
                  if entry.get("sha256") and entry["sha256"] != sha256(shard_path):
                      raise ValueError(f"sha256 mismatch for {entry['path']}")
              return f"{path}: {len(shards)} shards, {entry_total} records"

          def validate_provenance() -> str:
              provenance = load_json("provenance/merge-source.json")
              for key, value in expected.items():
                  if provenance.get(key) != value:
                      raise ValueError(f"{key}={provenance.get(key)!r}, expected {value!r}")
              return "pinned refs match workflow inputs"

          def validate_stats() -> str:
              stats = load_json("docs/stats.json")
              largest = int(stats.get("largest_generated_file_bytes", 0) or 0)
              if largest <= 0:
                  raise ValueError("largest_generated_file_bytes is missing")
              required = [
                  "quality_shard_count",
                  "security_shard_count",
                  "ranking_shard_count",
                  "search_shard_count",
                  "category_shard_count",
              ]
              missing = [key for key in required if int(stats.get(key, 0) or 0) <= 0]
              if missing:
                  raise ValueError(f"missing positive shard counts: {', '.join(missing)}")
              return f"largest_generated_file_bytes={largest}"

          def validate_skill_mirror() -> str:
              stats = load_json("docs/stats.json")
              expected_skills = int(stats.get("archive_skill_md_count_raw", 0) or 0)
              expected_metadata = int(stats.get("archive_metadata_count_raw", 0) or 0)
              skill_paths = sorted((root / "skills").rglob("SKILL.md"))
              metadata_paths = sorted((root / "skills").rglob("metadata.json"))
              if len(skill_paths) != expected_skills:
                  raise ValueError(
                      f"skills/SKILL.md count={len(skill_paths)}, expected {expected_skills}"
                  )
              if len(metadata_paths) != expected_metadata:
                  raise ValueError(
                      f"skills/metadata.json count={len(metadata_paths)}, expected {expected_metadata}"
                  )
              ignored_scan = subprocess.run(
                  [
                      "git",
                      "ls-files",
                      "--others",
                      "--ignored",
                      "--exclude-standard",
                      "--",
                      "skills",
                  ],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if ignored_scan.returncode != 0:
                  raise ValueError(ignored_scan.stderr.strip() or "git ignored-file scan failed")
              ignored = [
                  line
                  for line in ignored_scan.stdout.splitlines()
                  if line.endswith("/SKILL.md") or line.endswith("/metadata.json")
              ]
              if ignored:
                  sample = ", ".join(ignored[:5])
                  raise ValueError(
                      f"{len(ignored)} mirrored skill files are ignored by git: {sample}"
                  )
              return (
                  f"{len(skill_paths)} SKILL.md and {len(metadata_paths)} metadata files "
                  "match stats and are not ignored"
              )

          def validate_registry() -> str:
              assert_pointer("registry.json", "registry-manifest.json")
              return assert_manifest("registry-manifest.json")

          def validate_category_manifest() -> str:
              index = load_json("docs/categories/index.json")
              categories = index.get("categories")
              if not isinstance(categories, list) or not categories:
                  raise ValueError("docs/categories/index.json has no categories")
              first = categories[0]
              if not isinstance(first, dict):
                  raise ValueError("docs/categories/index.json category entry is not an object")
              manifest = first.get("manifest")
              if not isinstance(manifest, str) or not manifest.strip():
                  raise ValueError("docs/categories/index.json category entry missing manifest")
              manifest_path = Path(manifest)
              if manifest_path.is_absolute() or ".." in manifest_path.parts:
                  raise ValueError(f"invalid category manifest path: {manifest}")
              detail = assert_manifest(
                  f"docs/{manifest}",
                  count_key="count",
                  artifact_base="docs",
              )
              return f"{len(categories)} categories indexed; {detail}"

          check("provenance refs", validate_provenance)
          check("registry pointer and manifest", validate_registry)
          check(
              "search pointer and manifest",
              lambda: (
                  assert_pointer("docs/search-index.json", "search-index-manifest.json")
                  + "; "
                  + assert_manifest("docs/search-index-manifest.json", artifact_base="docs")
              ),
          )
          for name in ("quality", "security", "ranking"):
              check(
                  f"{name} signal pointer and manifest",
                  lambda name=name: (
                      assert_pointer(
                          f"docs/{name}-index.json",
                          f"{name}-index-manifest.json",
                      )
                      + "; "
                      + assert_manifest(f"docs/{name}-index-manifest.json", artifact_base="docs")
                  ),
              )
          check("category index and dynamic manifest", validate_category_manifest)
          check("stats shard summary", validate_stats)
          check("skills mirror count and gitignore", validate_skill_mirror)

          failed = [item for item in checks if item["status"] != "passed"]
          status = {
              "schema_version": 1,
              "status": "failed" if failed else "passed",
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "core_repo": expected["core_repo"],
              "core_sha": expected["core_sha"],
              "data_repo": expected["data_repo"],
              "data_sha": expected["data_sha"],
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "github_run_url": run_url,
              "promotion_gate": {
                  "mode": "pre-commit canary validation",
                  "result": "blocked" if failed else "allowed",
              },
              "rollback_contract": {
                  "strategy": "rerun this workflow with a previous known-good provenance tuple",
                  "source_of_truth": "provenance/merge-source.json from the previous good main commit",
                  "required_inputs": ["core_sha", "data_sha"],
              },
              "checks": checks,
          }
          status_path.parent.mkdir(parents=True, exist_ok=True)
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## Publish canary validation\n\n")
                  summary.write(f"- Status: `{status['status']}`\n")
                  summary.write(f"- Core: `{status['core_sha']}`\n")
                  summary.write(f"- Data: `{status['data_sha']}`\n")
                  summary.write(f"- Promotion: `{status['promotion_gate']['result']}`\n")
                  summary.write("\n| Check | Status | Detail |\n")
                  summary.write("| --- | --- | --- |\n")
                  for item in checks:
                      detail = str(item["detail"]).replace("|", "\\|")
                      summary.write(f"| {item['name']} | {item['status']} | {detail} |\n")
          if failed:
              print(json.dumps(status, ensure_ascii=False, indent=2))
              raise SystemExit("Publish canary validation failed")
          print(f"Publish canary validation passed; wrote {status_path}")
          PY

      - name: Upload publish status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publish-status
          path: provenance/publish-status.json
          if-no-files-found: ignore

      - name: Commit and push publish result
        env:
          CORE_SHA: ${{ steps.refs.outputs.core_sha }}
          DATA_SHA: ${{ steps.refs.outputs.data_sha }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A
          git add -f skills
          if git diff --staged --quiet; then
            echo "No main artifact changes"
            exit 0
          fi

          test -s "$RUNNER_TEMP/publish-commit-message.txt"
          git commit --file "$RUNNER_TEMP/publish-commit-message.txt"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              wait_time=$((attempt * 20))
              echo "Push failed (attempt $attempt). Retrying in ${wait_time}s..."
              sleep "$wait_time"
            fi
          done
          echo "Push failed after 3 attempts."
          exit 1
