schema_version: 2
default_category: other
governance:
  status_values: [active]
  migration_plan_schema_version: 1
  review_required_for: [legacy, unknown, source-conflict]
  confidence_bands:
    high: "score >= 4 and delta >= 3, or a deterministic legacy migration target"
    medium: "score >= 3 with a clear target but not enough evidence to apply"
    low: "weak signal or conflicting category sources"
legacy_migrations:
  - slug: machine-learning
    target: ai-ml
    reason: "Legacy synonym for AI / ML."
  - slug: dev
    target: development
    reason: "Legacy short-form source category for Development."
  - slug: engineering
    target: development
    reason: "Legacy source category for Development."
  - slug: software-engineering
    target: development
    reason: "Legacy source category for Development."
  - slug: programming
    target: development
    reason: "Legacy source category for Development."
  - slug: documentation
    target: documents
    reason: "Legacy synonym for Documents."
  - slug: docs
    target: documents
    reason: "Historical short-form duplicate of Documents."
  - slug: test
    target: testing
    reason: "Historical singular duplicate of Testing."
  - slug: specialized-testing
    target: testing
    reason: "Historical duplicate of Testing."
  - slug: testing-methodologies
    target: testing
    reason: "Historical duplicate of Testing."
  - slug: technical-integration
    target: integration
    reason: "Historical duplicate of Integration."
  - slug: development-code
    target: development
    reason: "Development Code is redundant with Development."
  - slug: data-access
    target: data
    reason: "Data Access is included by the Data category."
  - slug: adb-meta-automation
